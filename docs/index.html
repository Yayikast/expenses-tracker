<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Expenses</title>
  <meta name="theme-color" content="#F5F4F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111112" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Expenses">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="referrer" content="no-referrer">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <!-- Open connections to Google early: the data request is the slowest part of startup -->
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Font loads in the background so it never delays the first screen -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap"></noscript>
  <link rel="stylesheet" href="styles.css?v=5">
  <!-- Start downloading the chart library now, in parallel; app.js uses it when it arrives -->
  <link rel="preload" as="script" href="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js">
</head>
<body>
  <div id="login" hidden></div>
  <div id="app" hidden>
    <main id="main">
      <section id="view-home" class="view"></section>
      <section id="view-history" class="view" hidden></section>
      <section id="view-friends" class="view" hidden></section>
      <section id="view-settings" class="view" hidden></section>
    </main>

    <nav class="tabbar" aria-label="Main">
      <button class="tab is-active" data-view="home" aria-label="Home">
        <svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z"/></svg>
        <span>Home</span>
      </button>
      <button class="tab" data-view="history" aria-label="History">
        <svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg>
        <span>History</span>
      </button>
      <button class="tab tab-add" id="btn-add" aria-label="Add">
        <span class="add-circle"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>
      </button>
      <button class="tab" data-view="friends" aria-label="Friends">
        <svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="3.2"/><path d="M3.5 19c.6-3 2.8-4.6 5.5-4.6s4.9 1.6 5.5 4.6"/><circle cx="16.5" cy="8" r="2.6"/><path d="M15.5 13.6c2.6-.3 4.6 1.2 5 4"/></svg>
        <span>Friends</span>
      </button>
      <button class="tab" data-view="settings" aria-label="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg>
        <span>Settings</span>
      </button>
    </nav>
  </div>

  <div id="sheet-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="slip-input" accept="image/*" multiple hidden>

  <!-- Chart.js and jsQR are loaded by app.js only when needed, so they don't hold up startup -->
  <script src="config.js?v=5"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
